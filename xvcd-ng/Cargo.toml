[package]
name = "xvcd-ng"
version = "0.1.0"
edition = "2024"

[dependencies]
byteorder = "1.5.0"
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.33"
nusb = "0.2.5"
tokio = { version = "1.53.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }
